services:
  client-api:
    uri: ${CLIENT_API_URI:http://localhost:8080}
  product-api:
    uri: ${PRODUCT_API_URI:http://localhost:8081}

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - '*'
          routes:
            - id: client-api
              uri: ${services.client-api.uri}
              predicates:
                - Path=/api/clients/**
            - id: product-api
              uri: ${services.product-api.uri}
              predicates:
                - Path=/api/products/**


security:
  cloud-run-auth:
    enabled: ${CLOUD_RUN_AUTH_ENABLED:false}

